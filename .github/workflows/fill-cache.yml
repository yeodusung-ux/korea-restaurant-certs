name: 관광공사 상세 캐시 채우기

# 왜 따로 도나
#   관광공사 대표메뉴·영업시간은 **종목당 1콜**이라 13,521콜이 필요한데,
#   개발계정 한도는 **하루 1,000콜**이고 이 API 는 **병렬 호출을 429 로 거부**한다
#   (2026-08-09 실측: 4스레드 → 전량 Too Many Requests). 순차 ~2.7초/건이 사실상 상한이다.
#   → 하루 400건씩 나눠 받아 캐시에 쌓는다. 약 34일이면 전량 완성.
#   사이트 재빌드(update.yml)는 주 1회 그대로 두고, 여기서는 캐시 파일만 커밋한다
#   (11MB index.html 을 매일 커밋하면 리포가 금세 비대해진다).

on:
  schedule:
    - cron: "0 18 * * *"     # 매일 18:00 UTC = 03:00 KST
  workflow_dispatch:

concurrency:
  group: tour-cache
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 캐시 채우기
        env:
          ODCLOUD_KEY: ${{ secrets.ODCLOUD_KEY }}
          CACHE_ONLY: "1"          # 목록+상세만 받고 사이트는 건드리지 않는다
          TOUR_DETAIL: "400"       # 400 × ~2.7초 ≈ 18분 · 하루 한도 1,000 안쪽
        run: python build/build_site.py

      - name: 캐시 커밋
        run: |
          if git diff --quiet -- build/tour_cache.json; then
            echo "새로 채운 것 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/tour_cache.json
          git commit -m "chore: 관광공사 상세 캐시 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      - name: 진척도
        if: always()
        run: |
          echo "### 캐시 진척" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          try:
              c = json.load(open("build/tour_cache.json", encoding="utf-8"))
              print("- 채움 **%s / 13,521건** (%.1f%%)" % (format(len(c), ","), len(c) / 135.21))
          except Exception as e:
              print("- 캐시를 읽지 못함: %s" % e)
          EOF
